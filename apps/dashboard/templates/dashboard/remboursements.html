{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Remboursement</title>

    <link rel="stylesheet"
          href="{% static 'dashboard/css/remboursements.css' %}">
</head>

<body>

<div class="remboursement-container">

    <h1>Remboursement</h1>
    {% if success %}
    <div class="message success">
        {{ success }}
    </div>
{% endif %}

{% if error %}
    <div class="message error">
        {{ error }}
    </div>
{% endif %}

    <form method="POST">
        {% csrf_token %}

         <input type="hidden" name="pret_id" id="pret_id">

        <div class="form-group">
            <label>Mécano</label>
            <input
                type="text"
                id="mecano"
                name="mecano"
                placeholder="Entrer le numéro mécano"
                required
            >
        </div>

        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="nom" readonly>
        </div>

        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="prenom" readonly>
        </div>

        <div class="form-group">
            <label>Montant du prêt</label>
            <input type="number" id="montant_pret" readonly>
        </div>

        <div class="form-group">
    <label>Montant versé</label>
    <input
        type="number"
        id="montant_verse"
        name="montant_verse"
        min="1"
        step="0.01"
        required
    >
      </div>
     <div class="form-group">
            <label>Reste à payer</label>
            <input type="number" id="reste_a_payer" readonly>
        </div>

        <div class="form-group">
            <label>Date du remboursement</label>
            <input type="date" name="date_remboursement" required>
        </div>

        <div class="form-group">
            <label>Mode de paiement</label>
            <select name="mode_paiement" required>
                <option value="">Sélectionner</option>
                <option value="espece">Espèces</option>
                <option value="banque">Banque</option>
            </select>
        </div>

        <button type="submit">
            Enregistrer le remboursement
        </button>

    </form>

</div>

<script src="{% static 'dashboard/js/remboursements.js' %}"></script>

</body>
</html>
