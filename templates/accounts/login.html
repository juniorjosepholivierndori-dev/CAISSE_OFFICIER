<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - GMMG</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f5;color:#17241d;font-family:Arial,sans-serif}.box{width:min(390px,calc(100% - 40px));padding:32px;background:#fff;border:1px solid #e7ede9;border-radius:14px;box-shadow:0 2px 12px #0f281c14}h1{margin:0 0 8px;color:#123a28}p{color:#6d7d75}.field{margin:18px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input{width:100%;padding:11px;border:1px solid #dbe5df;border-radius:8px;box-sizing:border-box;font-size:15px}.errorlist{color:#c0392b;padding-left:18px;font-size:13px}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#f0762f;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <h1>GMMG</h1>
    <p>Connectez-vous à votre espace membre.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="field"><label for="id_username">Nom d'utilisateur</label>{{ form.username }}{{ form.username.errors }}</div>
      <div class="field"><label for="id_password">Mot de passe</label>{{ form.password }}{{ form.password.errors }}</div>
      <button class="btn" type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
