{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Caisse des officiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dashboard/css/theme.css' %}">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-bg-waves"></div>
    
    <div class="auth-card">
      <img class="auth-logo" src="{% static 'dashboard/css/js/images/logo.gmmg.jpeg' %}" alt="Logo">
      <h2>Connexion</h2>
      
      <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div style="padding:11px;background:#fff0ef;color:#bd4038;border-radius:6px;margin-bottom:16px;font-size:13px;">
            {{ form.non_field_errors }}
          </div>
        {% endif %}
        
        <div class="form-group">
          <label for="id_username">Email ou Nom d'utilisateur</label>
          <input type="text" name="username" class="form-control" id="id_username" placeholder="Entrez votre email ou identifiant" required>
        </div>
        
        <div class="form-group">
          <label for="id_password">Mot de passe</label>
          <input type="password" name="password" class="form-control" id="id_password" placeholder="Entrez votre mot de passe" required>
        </div>
        
        <button class="btn btn-orange" style="margin-top: 10px;" type="submit"><i class="fa-solid fa-lock"></i> SE CONNECTER</button>
      </form>
      
      <div class="auth-footer">
        <p>Vous n'avez pas de compte ? <br> <a href="{% url 'dashboard:inscription' %}">Créer un compte</a></p>
      </div>
    </div>
  </div>
  <script src="{% static 'dashboard/js/all.min.js' %}"></script>
</body>
</html>
